<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer - User Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            min-height: 100vh;
            background-color: #f4f4f9;
        }

        /* Sidebar */
        .sidebar {
            width: 220px;
            background-color: #1f2937;
            color: #fff;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar h2 {
            text-align: center;
            padding: 20px;
            font-size: 1.6em;
            border-bottom: 1px solid #444;
        }

        .sidebar nav a {
            display: block;
            padding: 15px 20px;
            color: #fff;
            text-decoration: none;
            border-bottom: 1px solid #444;
            transition: background 0.3s;
        }

        .sidebar nav a:hover {
            background-color: #374151;
        }

        /* Main content */
        .main-content {
            flex: 1;
            padding: 30px;
        }

        .main-content h1 {
            margin-bottom: 20px;
            color: #111827;
        }

        .total-users {
            font-size: 1.2em;
            margin-bottom: 20px;
            color: #1f2937;
        }

        /* User table */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #374151;
            color: #fff;
        }

        tr:hover {
            background-color: #f0f0f0;
        }

        /* Action buttons */
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
            font-size: 0.9em;
        }

        .btn-update {
            background-color: #2563eb;
        }

        .btn-remove {
            background-color: #ef4444;
        }

        .btn-update:hover {
            background-color: #1e40af;
        }

        .btn-remove:hover {
            background-color: #b91c1c;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                flex-direction: row;
                overflow-x: auto;
            }

            .sidebar nav {
                display: flex;
            }

            .sidebar nav a {
                border-bottom: none;
                border-right: 1px solid #444;
            }

            .main-content {
                padding: 15px;
            }

            table, th, td {
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Dev Panel</h2>
        <nav>
            <a href="#">Dashboard</a>
            <a href="#">User Management</a>
            <a href="#">Settings</a>
            <a href="#">Logout</a>
        </nav>
    </div>

    <!-- Main content -->
    <div class="main-content">
        <h1>User Management</h1>
        <div class="total-users">Total Users: 5</div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Alice</td>
                    <td>alice@example.com</td>
                    <td>1234567890</td>
                    <td>
                        <button class="btn btn-update">Update</button>
                        <button class="btn btn-remove">Remove</button>
                    </td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Bob</td>
                    <td>bob@example.com</td>
                    <td>9876543210</td>
                    <td>
                        <button class="btn btn-update">Update</button>
                        <button class="btn btn-remove">Remove</button>
                    </td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Charlie</td>
                    <td>charlie@example.com</td>
                    <td>5678901234</td>
                    <td>
                        <button class="btn btn-update">Update</button>
                        <button class="btn btn-remove">Remove</button>
                    </td>
                </tr>
                <tr>
                    <td>4</td>
                    <td>David</td>
                    <td>david@example.com</td>
                    <td>6789012345</td>
                    <td>
                        <button class="btn btn-update">Update</button>
                        <button class="btn btn-remove">Remove</button>
                    </td>
                </tr>
                <tr>
                    <td>5</td>
                    <td>Eve</td>
                    <td>eve@example.com</td>
                    <td>7890123456</td>
                    <td>
                        <button class="btn btn-update">Update</button>
                        <button class="btn btn-remove">Remove</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
